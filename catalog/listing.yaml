locales:
  en:
    title: Knowledge
    tagline: Search your team's Notion pages, esa posts and documents in one place, and get answers that cite their sources.
    overview: |
      Knowledge brings a team's Notion pages, esa posts and Markdown documents into one searchable index inside the Project. People look up a rule or a procedure in their own words, or ask a question and get an answer that lists the passages it is based on.

      Day to day, people type what they want to know on the search screen. Matching passages come back ranked with their scores; the search can switch between hybrid, full-text and vector modes and be narrowed to particular collections. Ask answers from the same query: the citations appear first, then the answer streams in, and citations link to the original page. Optional LLM steps rerank the top results or expand the query with official terms and rephrasings.

      Sources keep the index current. A Notion source reads the pages and databases shared with the integration; an esa source imports one team's posts, optionally narrowed with esa search syntax and with WIP or archived posts included on request. Sync runs in the background with live progress, records the counts and errors of the last run, and removes documents that no longer exist in the source. Markdown documents can also be added by hand.

      Collections group documents and decide which groups can find them; Notion and esa permissions are not copied, so the collection's visibility applies to everything imported into it.

      Documents and their embeddings are stored in the Project's own database, and people sign in with their organisation account. Notion and esa tokens are write-only and can instead be set once in the Project's app settings. Other apps and scripts can call search and answer with an access key.
  ja:
    title: Knowledge
    tagline: Notionのページやesaの記事、社内のドキュメントをまとめて検索し、出典付きの回答を得られます。
    overview: |
      Knowledgeは、Notionのページ、esaの記事、Markdownのドキュメントをプロジェクト内のひとつの索引にまとめます。規程や手順を普段の言葉で探したり、質問して、根拠になった箇所が示された回答を受け取ったりできます。

      日々の使い方はシンプルです。検索画面に知りたいことを入力すると、一致した箇所がスコア付きで並びます。ハイブリッド・全文検索・ベクトル検索を切り替えたり、コレクションで絞り込んだりできます。「質問する」を押すと、同じ条件で回答を作ります。先に出典が表示され、続いて回答が順に表示されます。出典からは元のページを開けます。必要に応じて、LLMで上位の結果を並べ替えたり、正式な用語や言い換えを補って検索したりできます。

      索引はソースで最新に保ちます。Notionはインテグレーションに共有したページとデータベースを、esaは指定したチームの記事を取り込みます。esaは検索構文で対象を絞り込め、WIP記事やアーカイブ済みの記事を含めるかどうかも選べます。同期はバックグラウンドで進み、進捗はその場で確認できます。前回の同期の件数とエラーが記録され、ソースから消えたページは索引からも削除されます。Markdownのドキュメントを直接追加することもできます。

      コレクションごとに、検索できるグループを決められます。Notionやesaの権限は複製されず、取り込んだ内容にはコレクションの公開範囲が適用されます。

      ドキュメントと埋め込みはプロジェクト内のデータベースに保存され、サインインには組織のアカウントを使います。Notionやesaのトークンは書き込み専用で、プロジェクトのアプリ設定でまとめて管理することもできます。ほかのアプリやスクリプトからは、アクセスキーで検索と回答を呼び出せます。
highlights:
- screenshot: ask
  locales:
    en:
      title: Answers that show their sources
      body: Ask in your own words. The passages the answer draws on are listed first, with links to the original Notion page, esa post or document, and the answer follows.
    ja:
      title: 出典が分かる回答
      body: 普段の言葉で質問できます。回答の根拠になった箇所が先に並び、元のNotionページやesaの記事、ドキュメントを開いて確かめられます。
- screenshot: search
  locales:
    en:
      title: See exactly what matched
      body: Results show the matching passage and its score. Switch between hybrid, full-text and vector search, filter by collection, and let the LLM add official terms and rephrasings to the query.
    ja:
      title: 一致した箇所をそのまま確認
      body: 検索結果には一致した本文とスコアが表示されます。ハイブリッド・全文検索・ベクトル検索の切り替えやコレクションでの絞り込みに加え、LLMで正式な用語や言い換えを補えます。
- screenshot: sources
  locales:
    en:
      title: Keep Notion and esa in sync
      body: Add a Notion integration or an esa team as a source and sync it in the background. Each source shows the last run's counts and errors, and pages removed at the source drop out of the index.
    ja:
      title: Notionとesaを同期
      body: Notionのインテグレーションやesaのチームをソースとして追加し、バックグラウンドで同期します。前回の同期の件数とエラーが表示され、元から消えたページは索引からも外れます。
- screenshot: documents
  locales:
    en:
      title: Add your own Markdown
      body: Paste a Markdown document with a title and an optional source URL. It is split into chunks and embedded before it is saved, so it is searchable straight away.
    ja:
      title: Markdownを直接追加
      body: タイトルと出典URLを付けてMarkdownを貼り付けます。チャンク分割と埋め込みが済んでから保存されるので、すぐに検索できます。
- screenshot: collections
  locales:
    en:
      title: Decide who can find what
      body: Collections group documents and name the groups that can search them. Leave the groups empty to share a collection with everyone in the Project.
    ja:
      title: 公開範囲はコレクションで管理
      body: ドキュメントをコレクションにまとめ、検索できるグループを指定します。グループを空欄にすると、プロジェクトの全員が検索できます。
